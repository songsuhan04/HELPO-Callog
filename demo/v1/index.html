<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <!-- 아이콘 주소 끝의 ?v=2: 브라우저(특히 사파리)가 아이콘을 주소 기준으로 오래 기억해서, 그림을
         바꿔도 설치·공유 팝업에 예전 그라데이션 아이콘이 남았다(2026-11-21). 아이콘을 다시 바꾸면 숫자를 올린다. -->
    <link rel="icon" href="/favicon.ico?v=2" sizes="48x48" />
    <link rel="icon" type="image/png" href="/favicon.png?v=2" />
    <!-- iOS "홈 화면에 추가" 아이콘 — Android는 apple-touch-icon을 안 보고 아래 manifest를 본다 -->
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png?v=2" />
    <!-- Android "홈 화면에 추가"/설치 아이콘 -->
    <link rel="manifest" href="/manifest.webmanifest?v=2" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#F7F8FB" />
    <meta name="color-scheme" content="dark" />
    <!-- 홈 화면에 추가한 뒤 열었을 때 사파리 주소창 없이 전체화면 앱처럼 보이게 함.
         상태바 스타일은 "black"(반투명 아님)으로 — 반투명은 콘텐츠가 상태바 아래까지
         올라가서 안전영역(safe-area) 패딩을 별도로 잡아줘야 하는데, 지금 화면들은
         그 처리가 없어 노치 기기에서 내용이 가려질 수 있다. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="apple-mobile-web-app-title" content="Callog" />
    <meta name="mobile-web-app-capable" content="yes" />
    <!-- theme.css가 "Pretendard"를 먼저 찾지만 어디서도 불러오지 않아 조용히 맑은고딕으로
         떨어지고 있었다. 알라미 톤에 가장 가까운 Gothic A1을 실제로 불러온다. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Gothic+A1:wght@400;500;700;800&display=swap"
    />
    <title>Callog(콜록)</title>
    <!-- 저장된 바탕·글씨 크기를 화면이 그려지기 전에 입힌다.
         예전에는 앱이 뜬 뒤(AppShell의 useEffect)에 입혀서, 밝은 바탕을 고른 분도 처음에는
         기본값인 검은 바탕과 보통 글씨가 잠깐 보였다가 바뀌었다(검게 깜빡이고 크기가 출렁임).
         키와 값은 src/lib/elderDisplay.ts, guardianDisplay.ts와 같아야 한다. -->
    <script>
      (function () {
        try {
          var root = document.documentElement;
          var path = location.pathname;
          var elder = path.indexOf("/elder") === 0 || path.indexOf("/e/") === 0;
          var scales = [1, 1.15, 1.3];
          // 기본은 밝은 바탕(어르신 "한낮", 보호자 "라이트"). 예전 키에 직접 고른 값(밤하늘·다크가 아닌 것)이 있으면 이어 쓴다
          var theme = localStorage.getItem(elder ? "callog.elderTheme2" : "callog.guardianTheme2");
          if (!theme) {
            var old = localStorage.getItem(elder ? "callog.elderTheme" : "callog.guardianTheme");
            theme = old && old !== (elder ? "night" : "dark") ? old : elder ? "daylight" : "light";
          }
          var themes = elder ? ["daylight", "warm", "maxcontrast"] : ["light", "warm", "maxcontrast"];
          if (themes.indexOf(theme) >= 0) root.setAttribute(elder ? "data-elder-theme" : "data-guardian-theme", theme);
          var i = Number(localStorage.getItem(elder ? "callog.fontScale" : "callog.guardianFontScale") || "0");
          if (i > 0 && i < scales.length) root.style.setProperty("--font-scale", String(scales[i]));
        } catch (e) {
          // 저장소를 못 읽으면 기본값으로 그린다
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
