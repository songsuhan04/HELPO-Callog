<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 520" width="920" height="520" role="img" aria-label="Callog 아키텍처. 어르신 브라우저는 계정 없이 초대 토큰으로, 보호자 브라우저는 Auth 세션으로 Vercel의 정적 프론트에 접속한다. 프론트는 supabase-js로 Postgres를 직접 질의하며 RLS가 유일한 통제 장치다. Vercel Serverless Functions는 service_role로 RLS를 우회해 Supabase에 접근하고 Gemini를 호출하며, 보호자에게 Web Push를 보낸다. 크론은 GitHub Actions 매시간과 Vercel Cron 하루 1회 두 갈래다.">
  <style>
    svg { --bg: #ffffff; --fg: #11151c; --line: #c9d1da; --accent: #3b4ee0; }
    @media (prefers-color-scheme: dark) {
      svg { --bg: #161b23; --fg: #e7ebf1; --line: #313a47; --accent: #8c9bff; }
    }
    .bg   { fill: var(--bg); }
    .zone { fill: none; stroke: var(--line); stroke-width: 1.25; }
    .box  { fill: none; stroke: var(--fg); stroke-width: 1.4; opacity: .6; }
    .flow { fill: none; stroke: var(--fg); stroke-width: 1.5; opacity: .75; }
    .key  { fill: none; stroke: var(--accent); stroke-width: 2; }
    .head { fill: var(--fg); opacity: .75; }
    .headk{ fill: var(--accent); }
    text  { font-family: "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif; fill: var(--fg); }
    .t-zone { font-size: 10.5px; letter-spacing: .1em; opacity: .5; font-family: ui-monospace, "SFMono-Regular", Menlo, monospace; }
    .t-name { font-size: 13px; font-weight: 600; }
    .t-sub  { font-size: 10.5px; opacity: .62; }
    .t-s    { font-size: 12.5px; font-weight: 600; }
    .t-xs   { font-size: 10px; opacity: .62; }
    .t-fn   { font-size: 10.5px; opacity: .78; font-family: ui-monospace, "SFMono-Regular", Menlo, monospace; }
    .t-edge { font-size: 10.5px; opacity: .72; }
    .t-keyedge { font-size: 10.5px; font-weight: 600; fill: var(--accent); }
  </style>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" class="head"/>
    </marker>
    <marker id="arrA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" class="headk"/>
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="920" height="520"/>

  <rect class="zone" x="286" y="56" width="280" height="320" rx="10"/>
  <rect class="zone" x="656" y="56" width="240" height="196" rx="10"/>
  <text class="t-zone" x="298" y="74">VERCEL</text>
  <text class="t-zone" x="668" y="74">SUPABASE</text>

  <rect class="box" x="24"  y="84"  width="172" height="72"  rx="8"/>
  <rect class="box" x="24"  y="200" width="172" height="72"  rx="8"/>
  <rect class="box" x="306" y="84"  width="240" height="56"  rx="7"/>
  <rect class="box" x="306" y="164" width="240" height="190" rx="7"/>
  <rect class="box" x="656" y="292" width="240" height="64"  rx="8"/>
  <rect class="box" x="236" y="432" width="186" height="64"  rx="8"/>
  <rect class="box" x="440" y="432" width="186" height="64"  rx="8"/>

  <g text-anchor="middle">
    <text class="t-name" x="110" y="114">어르신 브라우저</text>
    <text class="t-sub"  x="110" y="134">계정 없음 · 초대 토큰</text>
    <text class="t-name" x="110" y="230">보호자 브라우저</text>
    <text class="t-sub"  x="110" y="250">Supabase Auth 세션</text>

    <text class="t-name" x="426" y="108">정적 프론트</text>
    <text class="t-sub"  x="426" y="128">Vite · React 19 · PWA</text>
    <text class="t-s"    x="426" y="188">Serverless Functions ×8</text>

    <text class="t-s"  x="776" y="100">Postgres + RLS</text>
    <text class="t-xs" x="776" y="119">마이그레이션 15개</text>
    <text class="t-s"  x="776" y="152">Auth</text>
    <text class="t-xs" x="776" y="171">보호자 계정만</text>
    <text class="t-s"  x="776" y="204">Storage</text>
    <text class="t-xs" x="776" y="223">음성 30일 · 영상 7일 자동 삭제</text>

    <text class="t-s"  x="776" y="318">Google Gemini</text>
    <text class="t-xs" x="776" y="337">음성 분석 · 질문 생성</text>

    <text class="t-s"  x="329" y="458">GitHub Actions</text>
    <text class="t-xs" x="329" y="477">매시간 — 무응답 확인</text>
    <text class="t-s"  x="533" y="458">Vercel Cron</text>
    <text class="t-xs" x="533" y="477">하루 1회 (Hobby 제약)</text>
  </g>

  <g class="t-fn">
    <text x="322" y="214">assess-risk</text>
    <text x="322" y="234">analyze-voice</text>
    <text x="322" y="254">generate-questions</text>
    <text x="322" y="274">check-no-response</text>
    <text x="322" y="294">cleanup-old-letters</text>
    <text x="322" y="316" font-size="9.5" opacity="0.7">+ delete-account · health · push-status</text>
  </g>

  <g class="flow" marker-end="url(#arr)">
    <line x1="196" y1="102" x2="300" y2="102"/>
    <polyline points="196,212 250,212 250,126 300,126"/>
    <line x1="426" y1="140" x2="426" y2="158"/>
    <line x1="546" y1="200" x2="650" y2="200"/>
    <line x1="546" y1="320" x2="650" y2="322"/>
    <polyline points="306,300 230,300 230,252 202,252"/>
    <line x1="329" y1="432" x2="329" y2="360"/>
    <line x1="533" y1="432" x2="533" y2="360"/>
  </g>

  <line class="key" x1="546" y1="112" x2="650" y2="112" marker-end="url(#arrA)"/>

  <g class="t-edge" text-anchor="middle">
    <text x="248" y="94">/e/:token</text>
    <text x="244" y="166" text-anchor="end">로그인</text>
    <text x="598" y="192">service_role · RLS 우회</text>
    <text x="598" y="312">음성 분석</text>
    <text x="268" y="292" text-anchor="start">Web Push</text>
  </g>
  <text class="t-keyedge" x="598" y="104" text-anchor="middle">직접 질의 · RLS가 유일한 통제</text>
</svg>
